name: Vaultly Android build

on:
  push:
    paths:
      - "vaultly/**"
      - ".github/workflows/vaultly-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaultly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaultly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own Play upload key. Add these repository secrets:
      # VAULTLY_KEYSTORE_BASE64, VAULTLY_KEYSTORE_PASSWORD, VAULTLY_KEY_ALIAS, VAULTLY_KEY_PASSWORD
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VAULTLY_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VAULTLY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Real AdMob IDs come from secrets; without them the build uses Google's test ad IDs.
      - name: Build APK and App Bundle
        env:
          VAULTLY_KEYSTORE_PASSWORD: ${{ secrets.VAULTLY_KEYSTORE_PASSWORD }}
          VAULTLY_KEY_ALIAS: ${{ secrets.VAULTLY_KEY_ALIAS }}
          VAULTLY_KEY_PASSWORD: ${{ secrets.VAULTLY_KEY_PASSWORD }}
          VAULTLY_ADMOB_APP_ID: ${{ secrets.VAULTLY_ADMOB_APP_ID }}
          VAULTLY_ADMOB_INTERSTITIAL_ID: ${{ secrets.VAULTLY_ADMOB_INTERSTITIAL_ID }}
          VAULTLY_ADMOB_REWARDED_ID: ${{ secrets.VAULTLY_ADMOB_REWARDED_ID }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Vaultly-v1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Vaultly-v1.0.${{ github.run_number }}.aab"
          ls -la dist
          echo "APK size: $(du -h dist/*.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: Vaultly-v1.0.${{ github.run_number }}
          path: vaultly/dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vaultly-v1.0.${{ github.run_number }}
          name: Vaultly v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Vaultly – receipts, return windows and warranties in one premium vault.

            **Install:** download `Vaultly-v1.0.${{ github.run_number }}.apk` on your Android phone and open it (allow "Install unknown apps" when asked).
            The `.aab` file is for uploading to Google Play Console.
          files: vaultly/dist/*
