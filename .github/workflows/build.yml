name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk PDF-Studio.apk
          ls -la PDF-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-apk
          path: PDF-Studio.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PDF Studio build ${{ github.run_number }}
          body: Installable APK built from ${{ github.sha }} (${{ github.ref_name }}).
          prerelease: true
          files: PDF-Studio.apk
