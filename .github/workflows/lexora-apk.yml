name: Lexora APK

on:
  push:
    branches: [ "claude/english-learning-app-design-m665by" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Lexora.apk
          ls -la Lexora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lexora-apk
          path: Lexora.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lexora-build-${{ github.run_number }}
          name: Lexora build ${{ github.run_number }}
          body: Installable Lexora APK built from ${{ github.sha }} (${{ github.ref_name }}).
          prerelease: true
          files: Lexora.apk

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screen previews
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon recordRoborazziDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lexora-screenshots
          path: app/build/outputs/roborazzi/
