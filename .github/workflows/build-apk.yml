name: Build APK

on:
  push:
    paths:
      - "ImageToPdf/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ImageToPdf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: List APK sizes
        run: ls -lh app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ImageToPdf-apks
          path: ImageToPdf/app/build/outputs/apk/release/*.apk

      - name: Publish APKs as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Image to PDF – build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Install the APK that matches your phone:
            - **app-arm64-v8a-release.apk** – almost all phones from 2017 onward
            - **app-armeabi-v7a-release.apk** – older 32-bit phones
            - **app-x86_64-release.apk** – emulators / Chromebooks
          files: ImageToPdf/app/build/outputs/apk/release/*.apk
