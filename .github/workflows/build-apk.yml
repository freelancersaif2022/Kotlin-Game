name: Build Smart Island APK

on:
  push:
    paths:
      - "SmartIsland/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "SmartIsland/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartIsland
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP installs any missing platform itself.
      # Release build: R8-optimized and non-debuggable, which is what makes Compose fast on device.
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartIsland-release-apk
          path: SmartIsland/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
