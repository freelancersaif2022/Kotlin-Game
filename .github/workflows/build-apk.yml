name: Build APK

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/PyMaster-v1.0.0-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PyMaster-apk
          path: out/*.apk

      - name: Render UI screenshots
        continue-on-error: true
        run: |
          ./gradlew --no-daemon testDebugUnitTest --tests "com.saif.pymaster.ScreenshotTest" || true
          if [ -d app/build/screenshots ]; then
            (cd app/build/screenshots && zip -q -r "$GITHUB_WORKSPACE/out/screenshots.zip" .)
          fi
          ls -la out

      - name: Publish GitHub release
        if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PyMaster build ${{ github.run_number }}
          body: |
            PyMaster – Python learning app.
            Download the APK below and install it on your Android phone.
          files: |
            out/*.apk
            out/screenshots.zip
          prerelease: false
