name: PDF Master Android build

on:
  push:
    paths:
      - "pdf-app/**"
      - ".github/workflows/pdf-app.yml"
  workflow_dispatch:

concurrency:
  group: pdf-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pdf-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*(deprecated|unused)|What went wrong|Execution failed|> " build.log | grep -vE "^w: " | head -150

      - name: APK size
        run: |
          ls -la app/build/outputs/apk/release/
          du -h app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMaster-release-apk
          path: pdf-app/app/build/outputs/apk/release/*.apk

      - name: Render UI screenshots
        id: shots
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests "*ScreenshotTest*" 2>&1 | tee test.log
          ls -la app/screenshots

      - name: Show test errors
        if: steps.shots.outcome == 'failure'
        run: |
          grep -E "^e: |What went wrong|Exception|Error|at com\.pdfmaster" test.log | head -120 || true
          find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; | head -3 | xargs -r -I{} sh -c 'grep -A40 "<failure" {} | head -80'

      - name: Publish screenshots to branch
        if: steps.shots.outcome == 'success' && github.event_name == 'push'
        run: |
          pip install --quiet pillow
          mkdir -p docs/screenshots
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in sorted(glob.glob("app/screenshots/*.png")):
              im = Image.open(f).convert("RGB")
              im.thumbnail((540, 1200))
              im.save(os.path.join("docs/screenshots", os.path.basename(f)), optimize=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Update UI screenshots [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
