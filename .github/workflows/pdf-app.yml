name: PDF Master Android build

on:
  push:
    paths:
      - "pdf-app/**"
      - ".github/workflows/pdf-app.yml"
  workflow_dispatch:

concurrency:
  group: pdf-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK size
        run: |
          ls -la app/build/outputs/apk/release/
          du -h app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMaster-release-apk
          path: pdf-app/app/build/outputs/apk/release/*.apk
