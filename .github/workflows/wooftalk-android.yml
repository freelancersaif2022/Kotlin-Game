name: WoofTalk Android release APK

on:
  push:
    paths:
      - "wooftalk/**"
      - ".github/workflows/wooftalk-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wooftalk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wooftalk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Optional: add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS and KEY_PASSWORD to sign with your own upload key.
      # Without them the APK is signed with a debug key (fine for testing).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify APK signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "Verified|Signer #1 certificate (DN|SHA-256)"
          "$apksigner" verify build/app/outputs/flutter-apk/app-release.apk

      - name: Name the APK
        id: apk
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          name="WoofTalk-v${version}-build${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: wooftalk/${{ steps.apk.outputs.name }}

    outputs:
      name: ${{ steps.apk.outputs.name }}
      version: ${{ steps.apk.outputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wooftalk-v${{ needs.build.outputs.version }}-build${{ github.run_number }}
          name: WoofTalk v${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Release APK for WoofTalk, the animal voice translator prank app.
            Download the APK below and install it on any Android 7.0+ phone.
          files: ${{ needs.build.outputs.name }}
