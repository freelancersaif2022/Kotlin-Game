name: WoofTalk fetch real animal sounds

on:
  workflow_dispatch:
    inputs:
      animals:
        description: "Space separated animal ids (empty = all)"
        required: false
        default: ""
  push:
    paths:
      - "wooftalk/tool/fetch_sounds.py"
      - "wooftalk/tool/sound_sources.json"
      - ".github/workflows/wooftalk-fetch-sounds.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Download and cut sounds
        working-directory: wooftalk
        run: python3 tool/fetch_sounds.py ${{ github.event.inputs.animals }}

      - name: Commit sounds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wooftalk/assets/sounds
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Add real animal sounds from Wikimedia Commons"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
