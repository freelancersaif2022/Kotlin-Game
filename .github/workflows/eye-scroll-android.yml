name: EyeScroll Android build

on:
  push:
    paths:
      - "eye-scroll/**"
      - ".github/workflows/eye-scroll-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eye-scroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eye-scroll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own Play upload key. Add these repository secrets:
      # EYESCROLL_KEYSTORE_BASE64, EYESCROLL_KEYSTORE_PASSWORD, EYESCROLL_KEY_ALIAS, EYESCROLL_KEY_PASSWORD
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EYESCROLL_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "EYESCROLL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK and App Bundle
        env:
          EYESCROLL_KEYSTORE_PASSWORD: ${{ secrets.EYESCROLL_KEYSTORE_PASSWORD }}
          EYESCROLL_KEY_ALIAS: ${{ secrets.EYESCROLL_KEY_ALIAS }}
          EYESCROLL_KEY_PASSWORD: ${{ secrets.EYESCROLL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/EyeScroll-v1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/EyeScroll-v1.0.${{ github.run_number }}.aab"
          ls -la dist
          unzip -l dist/*.apk | grep '\.so$' || true

      - uses: actions/upload-artifact@v4
        with:
          name: EyeScroll-v1.0.${{ github.run_number }}
          path: eye-scroll/dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: eyescroll-v1.0.${{ github.run_number }}
          name: EyeScroll v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            EyeScroll – scroll any app with your eyes.

            **Install:** download `EyeScroll-v1.0.${{ github.run_number }}.apk` on your Android phone and open it (allow "Install unknown apps" when asked).
            The `.aab` file is for uploading to Google Play Console.
          files: eye-scroll/dist/*
