name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No KEYSTORE_BASE64 secret – release APK will be signed with the debug key."
          fi

      - name: Build debug + release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GhostDetector-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/GhostDetector-release.apk
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GhostDetector-apk
          path: out/*.apk

      - name: Publish GitHub release with APKs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ghost Detector build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Automated build from `${{ github.ref_name }}` @ ${{ github.sha }}.
            - **GhostDetector-release.apk** – optimized build (install this one)
            - **GhostDetector-debug.apk** – debug build
            Ads use Google AdMob **test** IDs. Replace them before publishing to Play.
          files: out/*.apk
