name: Build TV Remote APK

on:
  push:
    paths:
      - "TVRemote/**"
      - ".github/workflows/tvremote-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvremote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TVRemote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "Signing with the release keystore"
          else
            echo "No KEYSTORE_BASE64 secret: signing with a temporary debug key (fine for testing)"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="UniversalRemote-v${VERSION}-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          SIZE=$(du -h "$NAME" | cut -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### APK built: $NAME ($SIZE)" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: UniversalRemote-apk
          path: TVRemote/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: universal-remote-build-${{ github.run_number }}
          name: Universal Remote build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Universal Remote — release APK built from `${{ github.ref_name }}` (${{ github.sha }}).
            Download the APK below and install it on your Android phone (Android 8.0+).
          files: TVRemote/${{ steps.apk.outputs.name }}
