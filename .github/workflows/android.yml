name: Zyro Pay APK

on:
  push:
    branches: [ "**" ]
    paths-ignore: [ "**.md", "docs/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -150 || true

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ZyroPay.apk
          ls -la out
          echo "APK_SIZE=$(du -h out/ZyroPay.apk | cut -f1)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ZyroPay-apk
          path: out/ZyroPay.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zyropay-v1.0.0
          name: Zyro Pay v1.0.0
          target_commitish: ${{ github.sha }}
          make_latest: "false"
          overwrite_files: true
          body: |
            Zyro Pay Android app — release APK (${{ env.APK_SIZE }}), build #${{ github.run_number }}.
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}
            Download **ZyroPay.apk** below and install it on your Android phone (allow "Install unknown apps").
          files: out/ZyroPay.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ZyroPay-apk
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r out/ZyroPay.apk
            python3 .github/scripts/ui.py shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZyroPay-screenshots
          path: shots

      - name: Publish screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zyropay-screens
          name: Zyro Pay screenshots (CI)
          target_commitish: ${{ github.sha }}
          make_latest: "false"
          prerelease: true
          overwrite_files: true
          body: Screenshots captured automatically on an Android 14 emulator by the CI smoke test.
          files: shots/*
