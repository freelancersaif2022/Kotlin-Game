name: Build & release APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "SIGNING_STORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository release key."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - the APK is signed with a temporary key. See README > Release signing."
          fi

      - name: Unit tests and release build
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Bornomala-Keyboard-v${VERSION}.apk"
          ls -la dist
          SIZE=$(du -h dist/*.apk | cut -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Bornomala Keyboard v${VERSION} - APK size ${SIZE}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Bornomala-Keyboard-v${{ steps.apk.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error


  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Type on the keyboard in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke-test.sh "$(find apk -name '*.apk' | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: smoke/

  release:
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Bornomala-Keyboard-v${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Bornomala Keyboard v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Free Bangla + English keyboard: Phonetic (অভ্র style), National (জাতীয়) and English. No ads, no premium, no internet permission.

            **Install:** download `Bornomala-Keyboard-v${{ needs.build.outputs.version }}.apk` below, open it on your phone and allow installing from this source. Then open the app and follow the two setup steps.
