name: Build & release APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "SIGNING_STORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository release key."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - the APK is signed with a temporary key. See README > Release signing."
          fi

      - name: Unit tests and release build
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Bornomala-Keyboard-v${VERSION}.apk"
          ls -la dist
          SIZE=$(du -h dist/*.apk | cut -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Bornomala Keyboard v${VERSION} - APK size ${SIZE}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Bornomala-Keyboard-v${{ steps.apk.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Bornomala Keyboard v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Free Bangla + English keyboard: Phonetic (অভ্র style), National (জাতীয়) and English. No ads, no premium, no internet permission.

            **Install:** download `Bornomala-Keyboard-v${{ steps.apk.outputs.version }}.apk` below, open it on your phone and allow installing from this source. Then open the app and follow the two setup steps.
