name: Build Inkly APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Stable signing key from repository secrets (keeps the SHA-1 registered for Google Drive OAuth).
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INKLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.INKLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INKLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INKLY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "INKLY_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "INKLY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "INKLY_KEY_ALIAS=$KEY_ALIAS"
              echo "INKLY_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using release key from secrets"
          else
            echo "::warning::INKLY_KEYSTORE_BASE64 secret not set - signing with a cached debug key. Add the secrets for a stable Google Drive SHA-1."
          fi

      # Fallback: keep the auto-generated debug key between runs so its SHA-1 stays the same.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: inkly-debug-keystore-v1

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || { echo "---- errors ----"; grep -E "^e: |What went wrong" -A3 build.log | head -60; exit 1; }

      - name: Collect APK + signing info
        run: |
          cp app/build/outputs/apk/release/app-release.apk Inkly.apk
          ls -lh Inkly.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs Inkly.apk | tee signing.txt
          {
            echo "### Inkly APK"
            echo ""
            echo "Size: $(du -h Inkly.apk | cut -f1)"
            echo ""
            echo '```'
            cat signing.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Inkly-apk
          path: Inkly.apk

      - name: Publish downloadable release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="inkly-latest"
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" Inkly.apk \
            --target "$GITHUB_SHA" \
            --title "Inkly – latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Download Inkly.apk below and install it on your Android phone." \
            --prerelease
